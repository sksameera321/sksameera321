name: Dynamic Contribution Visualizers Updater

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-visualizers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Live Metrics and Regenerate All Visualizers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/update-all.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add contribution-calendar.svg contribution-skyline.svg contribution-wave.svg github-stats.svg top-langs.svg streak-stats.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(visualizers): auto-update dynamic stats, skyline, wave & streak [skip ci]" && git push)